[project]
name = "fabric-semantic-data-agent"
version = "0.1.0"
description = "Read-only Streamlit data agent for a Microsoft Fabric semantic model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.50,<2",
  "httpx>=0.28,<1",
  "msal>=1.31,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "streamlit>=1.50,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: calls external APIs and requires a configured .env",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["src/dataagent"]
omit = ["src/dataagent/ui.py"]

